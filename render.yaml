services:
  - type: web
    name: kabque-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn kabque.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DJANGO_SETTINGS_MODULE
        value: kabque.settings
      # Set these in the Render dashboard (Environment) — do not commit real values
      # Africa's Talking — SMS. Start in sandbox; real students are only reached
      # once this is flipped to "production" with a funded account.
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_ENVIRONMENT
        value: sandbox
      # Required for production only — your approved alphanumeric sender ID
      # (e.g. KabQue) or numeric shortcode. The sandbox app username is
      # always literally "sandbox" and the sender is ignored there.
      - key: AFRICAS_TALKING_SHORTCODE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: KabQue
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
